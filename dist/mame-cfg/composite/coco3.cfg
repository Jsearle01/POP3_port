<?xml version="1.0"?>
<!-- MAME coco3 preset: Monitor Type = Composite.  value="1" = RGB, value="0" = Composite.
     MAME's OWN DEFAULT IS COMPOSITE (value 0, confirmed via `mame -listxml coco3`),
     so this must be passed explicitly or the gate silently runs in the wrong mode.
     CLAUDE.md §4 makes RGB the project's monitor gate.
     Used via:  mame coco3 -cfg_directory dist/mame-cfg/rgb ...
     NOTE: MAME REWRITES this file on exit (adds mixer/video/image blocks) — harmless,
     but it means the file is a template, not a constant. -->
<mameconfig version="10">
    <system name="coco3">
        <input>
            <port tag=":screen_config" type="CONFIG" mask="1" defvalue="0" value="0" />
        </input>
    </system>
</mameconfig>
